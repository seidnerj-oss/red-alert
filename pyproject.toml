[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "red-alert"
version = "4.0.0"
description = "Israeli Home Front Command (Pikud Ha-Oref) alert monitor"
requires-python = ">=3.14"

dependencies = [
    "httpx",
]

[project.optional-dependencies]
homeassistant = [
    "appdaemon",
]
homebridge = [
    "aiohttp",
]
unifi = [
    "aiounifi",
    "pyotp",
    # pyunifiapi >= 0.2.0 (github.com/seidnerj-oss/pyunifiapi, git tag v0.2.0 or
    # later) is not on PyPI yet, so it can't be listed here; install it from
    # source (the CBS bridge needs its enable_ssh helper, added in 0.2.0). But its
    # cloud extra requires libdatachannel-py for WebRTC
    # SSH (used by CBS bridge to auto-enable SSH on LTE device reboots).
    # The pre-release specifier (>=X.dev0) is needed because stable 2025.1.2
    # lacks aarch64 wheels for Raspberry Pi OS (manylinux_2_36).
    # Remove this once pyunifiapi >= 0.2.0 is published to PyPI and added here directly.
    "libdatachannel-py>=2025.1.2.dev0",
    # lte-pro-access (github.com/seidnerj-oss/lte-pro-access, git tag v0.1.1) is not
    # on PyPI, so it is pinned to its git tag. The CBS bridge runs its supervisor
    # in-process with bridge_management "self" (SSH re-enable, socat upload, both
    # relays). It is imported lazily, so the package works without it.
    # Switch to a plain version specifier once it is published to PyPI.
    "lte-pro-access @ git+https://github.com/seidnerj-oss/lte-pro-access@v0.1.1",
]
homepod = [
    # pyatv is NOT a direct dependency - it's invoked as a subprocess via
    # atvremote under Python 3.13 (uv run --python 3.13 --with pyatv).
    # This is because pyatv depends on pydantic-core which requires PyO3,
    # and PyO3 does not support Python 3.14.
]
cbs = [
    # Bridge mode with bridge_management "self" needs the unifi extra (lte-pro-access,
    # which brings asyncssh, plus pyunifiapi); direct mode and "external" need nothing.
]

[dependency-groups]
dev = [
    "basedpyright",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-aiohttp",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
indent-width = 4
line-length = 150
# ruff does not yet support py314; using py313 as the closest available target
target-version = "py313"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# appdaemon (homeassistant) depends on pydantic-core, which can't build on
# Python 3.14 (PyO3 doesn't support it yet). Exclude it so basedpyright
# doesn't fail on unresolvable imports. Remove once PyO3 adds 3.14 support.
exclude = ["src/red_alert/integrations/outputs/homeassistant"]
# pyunifiapi and lte-pro-access are installed from source (see the unifi extra), so
# they may not resolve in a fresh checkout. Downgrade unresolved imports to warnings
# only in the CBS input package, the one place that imports them (lazily, inside
# functions, so the package works without them). Remove once both are published and listed as dependencies.
executionEnvironments = [
    { root = "src/red_alert/integrations/inputs/cbs", extraPaths = ["src"], reportMissingImports = "warning" },
]

[tool.uv]
required-version = ">=0.10"
